services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:8080"
    command: ["python3", "-m", "http.server", "8080", "--bind", "0.0.0.0"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
